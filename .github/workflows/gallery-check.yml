name: Gallery Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate gallery
        run: python3 scripts/check_gallery.py
      - name: Python tests
        run: python3 tests/test_gallery.py
      - name: Search / filter tests
        run: node tests/test_search.js
